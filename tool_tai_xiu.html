<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tool Tài/Xỉu</title><style>body{font-family:Arial,sans-serif;background:#10131a;color:#fff;max-width:560px;margin:auto;padding:16px}section{background:#1b202a;padding:18px;border-radius:16px;margin-bottom:14px}input,button{font-size:18px;padding:12px;border-radius:10px;border:1px solid #394150}input{width:27%;background:#111;color:#fff;text-align:center}button{width:100%;margin-top:12px;background:#527cff;color:#fff;border:0;font-weight:bold}.result{text-align:center;font-size:32px;font-weight:bold;margin:16px 0}.sum{text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#11151d;padding:14px;text-align:center;border-radius:10px}.stat b{display:block;font-size:24px;margin-top:5px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #303641;padding:10px 0}.note{color:#aeb6c5;font-size:14px;line-height:1.5}</style></head><body><section><h1>🎲 Tool phân tích Tài / Xỉu</h1><p class="note">Nhập 3 viên xúc xắc. Tài: 11–17, Xỉu: 4–10. Bộ ba được ghi riêng. Đây là thống kê dữ liệu đã nhập, không dự đoán chắc chắn kết quả.</p><div><input id="a" type="number" min="1" max="6" placeholder="1"><input id="b" type="number" min="1" max="6" placeholder="2"><input id="c" type="number" min="1" max="6" placeholder="3"></div><button onclick="add()">Phân tích</button><div id="r" class="result">—</div><div id="s" class="sum">Chưa có kết quả</div></section><section><h2>📊 Thống kê</h2><div class="grid"><div class="stat">Tài<b id="tp">0%</b><small id="tc">0 lượt</small></div><div class="stat">Xỉu<b id="xp">0%</b><small id="xc">0 lượt</small></div><div class="stat">Tổng lượt<b id="n">0</b></div><div class="stat">Bộ ba<b id="bt">0</b></div></div></section><section><h2>🧾 Lịch sử</h2><div id="h">Chưa có dữ liệu.</div><button onclick="clearData()" style="background:#343b49">Xóa lịch sử</button></section><script>let d=JSON.parse(localStorage.getItem('tx')||'[]');function add(){let x=[+a.value,+b.value,+c.value];if(x.some(v=>!Number.isInteger(v)||v<1||v>6)){alert('Nhập 3 số từ 1 đến 6');return}let sum=x.reduce((p,v)=>p+v,0),type=x[0]===x[1]&&x[1]===x[2]?'Bộ ba':sum>=11?'Tài':'Xỉu';d.unshift({x,sum,type,t:new Date().toLocaleTimeString('vi-VN')});localStorage.setItem('tx',JSON.stringify(d));render();r.textContent=type;s.textContent=x.join(' + ')+' = '+sum}function render(){let q=d.filter(v=>v.type==='Tài'||v.type==='Xỉu'),t=q.filter(v=>v.type==='Tài').length,x=q.filter(v=>v.type==='Xỉu').length;tp.textContent=(q.length?t/q.length*100:0).toFixed(1)+'%';xp.textContent=(q.length?x/q.length*100:0).toFixed(1)+'%';tc.textContent=t+' lượt';xc.textContent=x+' lượt';n.textContent=d.length;bt.textContent=d.filter(v=>v.type==='Bộ ba').length;h.innerHTML=d.length?d.map((v,i)=>`<div class="row"><span>#${d.length-i} · ${v.x.join('-')}<br><small>${v.t}</small></span><b>${v.type} (${v.sum})</b></div>`).join(''):'Chưa có dữ liệu.'}function clearData(){if(confirm('Xóa toàn bộ lịch sử?')){d=[];localStorage.removeItem('tx');render()}}render()</script></body></html>
